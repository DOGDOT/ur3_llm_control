controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

    gains:
      left_finger_joint:
        p: 2000.0
        d: 20.0
        i: 1.0
        i_clamp: 10.0
      right_finger_joint:
        p: 2000.0
        d: 20.0
        i: 1.0
        i_clamp: 10.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        left_finger_joint:
          kp: 2000.0
          ki: 1.0
          kd: 20.0
        right_finger_joint:
          kp: 2000.0
          ki: 1.0
          kd: 20.0